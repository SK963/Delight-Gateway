openapi: 3.0.3
info:
  title: Cake Delight API
  description: |
    Cloud-native microservices API for the **Cake Delight** application.

    ## Authentication
    Most endpoints require a **Bearer JWT token**. Obtain one by registering
    (`POST /api/auth/register`) and then logging in (`POST /api/auth/login`).

    Public endpoints (no token required):
    - `POST /api/auth/register`
    - `POST /api/auth/login`
    - `GET /health`
    - `GET /api-docs`
  version: 1.0.0
  contact:
    name: Cake Delight Team

servers:
  - url: http://localhost:3000
    description: Local Docker Compose

tags:
  - name: Auth
    description: User registration & login
  - name: Catalog
    description: Browse and manage cakes
  - name: Basket
    description: Shopping basket operations
  - name: Orders
    description: Checkout and order history
  - name: Ratings
    description: Submit and view cake ratings
  - name: Notifications
    description: Order confirmation notifications
  - name: Health
    description: Service health checks

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/auth/login

  schemas:
    # ── Auth ──────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@cakedelight.com
        password:
          type: string
          minLength: 6
          example: secret123
        name:
          type: string
          example: Jane Doe

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@cakedelight.com
        password:
          type: string
          example: secret123

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string

    # ── Cake ──────────────────────────────────────────────────────────────
    Cake:
      type: object
      properties:
        _id:
          type: string
          example: 667a1b2c3d4e5f6a7b8c9d0e
        name:
          type: string
          example: Velvet Midnight
        description:
          type: string
          example: Cocoa sponge, vanilla cream and dark chocolate curls.
        category:
          type: string
          example: Chocolate
        price:
          type: number
          example: 32
        imageUrl:
          type: string
          example: https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=900
        available:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CakeInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          example: Tiramisu Tower
        description:
          type: string
          example: Layers of espresso-soaked sponge and mascarpone.
        category:
          type: string
          example: Coffee
        price:
          type: number
          minimum: 0
          example: 38
        imageUrl:
          type: string
          example: https://example.com/tiramisu.jpg
        available:
          type: boolean
          default: true

    # ── Basket ────────────────────────────────────────────────────────────
    BasketItem:
      type: object
      properties:
        cakeId:
          type: string
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer

    Basket:
      type: object
      properties:
        _id:
          type: string
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BasketItem"
        total:
          type: number

    AddToBasketRequest:
      type: object
      required: [cakeId]
      properties:
        cakeId:
          type: string
          example: 667a1b2c3d4e5f6a7b8c9d0e
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 2

    UpdateQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3

    # ── Order ─────────────────────────────────────────────────────────────
    CheckoutRequest:
      type: object
      required: [customerEmail]
      properties:
        customerEmail:
          type: string
          format: email
          example: user@cakedelight.com

    Order:
      type: object
      properties:
        _id:
          type: string
        customerId:
          type: string
        customerEmail:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BasketItem"
        total:
          type: number
        status:
          type: string
          enum: [CONFIRMED, PROCESSING, DELIVERED]
        createdAt:
          type: string
          format: date-time

    # ── Rating ────────────────────────────────────────────────────────────
    Rating:
      type: object
      properties:
        _id:
          type: string
        cakeId:
          type: string
        customerId:
          type: string
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    RatingInput:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          maxLength: 500
          example: Absolutely delicious!

    RatingSummary:
      type: object
      properties:
        cakeId:
          type: string
        average:
          type: number
          example: 4.5
        count:
          type: integer
          example: 12

    # ── Notification ──────────────────────────────────────────────────────
    Notification:
      type: object
      properties:
        _id:
          type: string
        orderId:
          type: string
        recipient:
          type: string
        type:
          type: string
          example: ORDER_CONFIRMATION
        status:
          type: string
          example: SENT
        message:
          type: string
        sentAt:
          type: string
          format: date-time

    # ── Common ────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    HealthReport:
      type: object
      properties:
        service:
          type: string
          example: api-gateway
        status:
          type: string
          enum: [ok, degraded]
        uptime:
          type: number
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string

security:
  - BearerAuth: []

paths:
  # ── Auth ────────────────────────────────────────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string

  # ── Health ──────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Aggregated health check for all services
      security: []
      responses:
        "200":
          description: All services healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: One or more services degraded

  # ── Catalog ─────────────────────────────────────────────────────────────
  /api/cakes:
    get:
      tags: [Catalog]
      summary: List available cakes
      description: Supports filtering by name, category, and price range.
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Filter by name (case-insensitive partial match)
        - name: category
          in: query
          schema:
            type: string
            enum: [Chocolate, Fruit, Birthday, Wedding, Cupcake, Coffee]
          description: Filter by exact category
        - name: minPrice
          in: query
          schema:
            type: number
          description: Minimum price
        - name: maxPrice
          in: query
          schema:
            type: number
          description: Maximum price
      responses:
        "200":
          description: List of cakes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cake"
    post:
      tags: [Catalog]
      summary: Create a new cake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CakeInput"
      responses:
        "201":
          description: Cake created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cake"

  /api/cakes/{id}:
    get:
      tags: [Catalog]
      summary: Get a single cake by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cake details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cake"
        "404":
          description: Cake not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Catalog]
      summary: Update a cake
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CakeInput"
      responses:
        "200":
          description: Cake updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cake"
        "404":
          description: Cake not found
    delete:
      tags: [Catalog]
      summary: Delete a cake
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cake deleted
        "404":
          description: Cake not found

  # ── Basket ──────────────────────────────────────────────────────────────
  /api/basket:
    get:
      tags: [Basket]
      summary: View current basket
      responses:
        "200":
          description: Current basket contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Basket"

  /api/basket/items:
    post:
      tags: [Basket]
      summary: Add item to basket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToBasketRequest"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Basket"
        "400":
          description: Invalid request

  /api/basket/items/{cakeId}:
    patch:
      tags: [Basket]
      summary: Update item quantity
      parameters:
        - name: cakeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuantityRequest"
      responses:
        "200":
          description: Quantity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Basket"
        "404":
          description: Item not in basket
    delete:
      tags: [Basket]
      summary: Remove item from basket
      parameters:
        - name: cakeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Basket"

  # ── Orders ──────────────────────────────────────────────────────────────
  /api/orders/checkout:
    post:
      tags: [Orders]
      summary: Checkout basket and create order
      description: |
        Creates an order from the current basket, clears the basket,
        and publishes an `ORDER_COMPLETED` event to Kafka.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Basket is empty or email missing

  /api/orders:
    get:
      tags: [Orders]
      summary: List orders for current customer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found

  # ── Ratings ─────────────────────────────────────────────────────────────
  /api/cakes/{cakeId}/ratings:
    get:
      tags: [Ratings]
      summary: List ratings for a cake
      parameters:
        - name: cakeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rating"
    post:
      tags: [Ratings]
      summary: Submit a rating for a cake
      parameters:
        - name: cakeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "201":
          description: Rating submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          description: Invalid score

  /api/cakes/{cakeId}/ratings/summary:
    get:
      tags: [Ratings]
      summary: Get average rating and count for a cake
      parameters:
        - name: cakeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingSummary"

  # ── Notifications ───────────────────────────────────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: List all notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /api/notifications/{orderId}:
    get:
      tags: [Notifications]
      summary: Get notifications for a specific order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notifications for the order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "404":
          description: No notifications found
